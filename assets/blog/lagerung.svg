<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vorratsglas, Thermometer und Tropfen als Sinnbild für die richtige Lagerung">
  <rect width="1200" height="630" fill="#e3ebe0"/>
  <!-- Storage jar -->
  <g transform="translate(430,150)">
    <rect x="40" y="40" width="220" height="300" rx="28" fill="#ffffff" stroke="#27503a" stroke-width="6"/>
    <rect x="80" y="10" width="140" height="50" rx="14" fill="#27503a"/>
    <!-- leaf inside -->
    <g transform="translate(150,210)" fill="#4a7559">
      <path d="M0,0 C -26,-66 -13,-145 0,-158 C 13,-145 26,-66 0,0 Z"/>
      <path d="M0,0 C -22,-56 -11,-124 0,-134 C 11,-124 22,-56 0,0 Z" transform="rotate(40)"/>
      <path d="M0,0 C -22,-56 -11,-124 0,-134 C 11,-124 22,-56 0,0 Z" transform="rotate(-40)"/>
    </g>
  </g>
  <!-- thermometer -->
  <g transform="translate(770,140)">
    <rect x="0" y="0" width="26" height="230" rx="13" fill="#ffffff" stroke="#16321f" stroke-width="5"/>
    <circle cx="13" cy="250" r="30" fill="#c9913f"/>
    <rect x="6" y="120" width="14" height="130" rx="7" fill="#c9913f"/>
  </g>
  <!-- droplet (humidity) -->
  <g transform="translate(870,330)">
    <path d="M0,-40 C 30,0 30,20 0,40 C -30,20 -30,0 0,-40 Z" fill="#4a7559"/>
  </g>
  <text x="120" y="575" font-family="Hanken Grotesk, Arial, sans-serif" font-size="30" font-weight="600" fill="#13241b">Richtig aufbewahren · 15–20 °C · 59–63 % rF</text>
</svg>
