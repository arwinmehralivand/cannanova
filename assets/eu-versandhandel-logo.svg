<svg viewBox="0 0 300 142" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gemeinsames EU-Versandhandelslogo für den Online-Verkauf von Arzneimitteln – Deutschland">
  <title>EU-Versandhandelslogo (Sicherheitslogo)</title>
  <!-- Outer frame -->
  <rect x="1" y="1" width="298" height="140" rx="12" fill="#ffffff" stroke="#0a7a3c" stroke-width="2"/>
  <!-- Left green banded field with white medical cross -->
  <clipPath id="leftField"><rect x="2" y="2" width="176" height="138" rx="11"/></clipPath>
  <g clip-path="url(#leftField)">
    <rect x="2" y="2" width="176" height="138" fill="#0a7a3c"/>
    <g fill="#ffffff" opacity="0.16">
      <rect x="2" y="20" width="176" height="10"/>
      <rect x="2" y="48" width="176" height="10"/>
      <rect x="2" y="76" width="176" height="10"/>
      <rect x="2" y="104" width="176" height="10"/>
    </g>
    <!-- white cross -->
    <g fill="#ffffff">
      <rect x="78" y="40" width="24" height="62" rx="4"/>
      <rect x="59" y="59" width="62" height="24" rx="4"/>
    </g>
  </g>
  <!-- Right white field with German flag + label -->
  <g>
    <rect x="196" y="24" width="86" height="46" rx="4" fill="#000000"/>
    <rect x="196" y="24" width="86" height="46" rx="4" fill="none"/>
    <rect x="196" y="24" width="86" height="15.3" fill="#000000"/>
    <rect x="196" y="39.3" width="86" height="15.3" fill="#dd0000"/>
    <rect x="196" y="54.6" width="86" height="15.4" fill="#ffce00"/>
    <text x="239" y="92" text-anchor="middle" font-family="Hanken Grotesk, Arial, sans-serif" font-size="13" font-weight="700" fill="#0a7a3c">Versandhandel</text>
    <text x="239" y="110" text-anchor="middle" font-family="Hanken Grotesk, Arial, sans-serif" font-size="10" fill="#3c5446">Zugelassene Apotheke</text>
    <text x="239" y="124" text-anchor="middle" font-family="Hanken Grotesk, Arial, sans-serif" font-size="9" fill="#7e9a84">Hier auf Echtheit prüfen</text>
  </g>
</svg>
